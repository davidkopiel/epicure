apiVersion: v1
kind: Service
metadata:
  name: my-react-app-service # Choose a name for your service
spec:
  selector:
    app: my-react-app # Must match the labels in your Deployment
  ports:
    - protocol: TCP
      port: 80 # Port the service will be accessible on within the cluster
      targetPort: 3000 # Port your container listens on (from Dockerfile EXPOSE)
  type: LoadBalancer # Or ClusterIP, NodePort depending on how you want to expose it
