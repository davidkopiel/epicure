name: Build, Push to Artifactory, Deploy to K8s

# Trigger the workflow on pushes to the main branch
on:
  push:
    branches: [ main ] # Or your default branch like 'master'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
      # 1. Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (recommended for build enhancements)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Artifactory Docker Registry
      - name: Log in to Artifactory Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARTIFACTORY_URL }}
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      # 4. Define Image Name and Tag
      - name: Set Image Name and Tag
        id: image_meta
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME="${{ secrets.ARTIFACTORY_URL }}/${{ vars.ARTIFACTORY_DOCKER_REPO }}/my-react-app" # Replace 'my-react-app' if needed
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full_image_name=${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image will be tagged as: ${IMAGE_NAME}:${IMAGE_TAG}"

# 5. Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.full_image_name }}
          # Pass the secret NPM token as a build argument
          build-args: |
            NPM_TOKEN=${{ secrets.ARTIFACTORY_NPM_TOKEN }}
          # Optional: Enable caching to speed up builds
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      # 6. Set up Kubeconfig for kubectl
      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_BASE64 }}

      # 7. Update Kubernetes Manifest with the new Image Tag
      # This step assumes your deployment.yaml has '__IMAGE_NAME__' as a placeholder
      - name: Update Kubernetes deployment image
        run: |
          echo "Updating deployment manifest with image: ${{ steps.image_meta.outputs.full_image_name }}"
          # Replace the placeholder in the deployment file. Adjust path if needed.
          sed -i "s|__IMAGE_NAME__|${{ steps.image_meta.outputs.full_image_name }}|g" k8s/deployment.yaml
          echo "--- Updated k8s/deployment.yaml ---"
          cat k8s/deployment.yaml # Print the updated file for verification
          echo "-----------------------------------"

      # 8. Deploy to Kubernetes Cluster
      - name: Deploy to Kubernetes
        run: |
          echo "Applying Kubernetes manifests..."
          kubectl apply -f k8s/ # Apply all files in the k8s directory
          echo "Waiting for deployment rollout to complete..."
          # Replace 'my-react-app-deployment' with the actual 'metadata.name' from your deployment.yaml
          # Add '-n your-namespace' if your deployment is not in the 'default' namespace
          kubectl rollout status deployment/my-react-app-deployment --timeout=120s # Wait up to 2 minutes
